name: Предпросмотр на REG.RU

on:
  push:
    branches:
      - preview
    paths:
      - "src/**"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regru-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Получить файлы сайта
        uses: actions/checkout@v4

      - name: Подготовить SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REGRU_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.REGRU_SSH_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/regru
          chmod 600 ~/.ssh/regru
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Опубликовать предпросмотр
        env:
          SSH_HOST: ${{ secrets.REGRU_SSH_HOST }}
          SSH_USER: ${{ secrets.REGRU_SSH_USER }}
        run: |
          test -f src/index.html
          tar -C src -czf - . | ssh \
            -i ~/.ssh/regru -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            'set -e; target="$HOME/www/seraya.store/_preview/regru-deploy-test"; mkdir -p "$target"; find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; tar -xzf - -C "$target"; test -f "$target/index.html"; echo PREVIEW_DEPLOY_OK'

      - name: Показать адрес
        run: echo "https://seraya.store/_preview/regru-deploy-test/"
